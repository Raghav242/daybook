# Manual production deploy: test one commit, then deploy exactly that commit to Render.
# There is no push/pull_request trigger, and Render auto-deploy must stay off.
name: Deploy to Render

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-production
  cancel-in-progress: false

env:
  # Disposable CI-only database; never a real one.
  CI_DATABASE_URL: postgresql+psycopg://daybook:ci-only-password@127.0.0.1:5432/daybook_ci

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: daybook_ci
          POSTGRES_USER: daybook
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U daybook -d daybook_ci"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (disposable PostgreSQL)
        env:
          TEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: daybook_ci
          POSTGRES_USER: daybook
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U daybook -d daybook_ci"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the combined production image
        run: docker build -t daybook:ci .
      - name: Start it against the disposable database
        run: |
          docker run -d --name daybook --network host \
            -e PORT=10000 \
            -e DATABASE_URL="$CI_DATABASE_URL" \
            -e CORS_ORIGINS=https://daybook.ci.example \
            daybook:ci
      - name: Smoke test (static frontend, caching, CSRF, login, database)
        run: python3 scripts/smoke_production.py http://127.0.0.1:10000 https://daybook.ci.example
      - name: Container logs
        if: always()
        run: docker logs daybook

  deploy:
    needs: [backend, frontend, image]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the tested commit and wait for it to go live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: python3 .github/scripts/render_deploy.py
