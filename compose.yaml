# Local development topology. Connection settings are supplied by .env or the shell.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command: ["postgres", "-p", "${POSTGRES_PORT:?Set POSTGRES_PORT}"]
    ports:
      - "${HOST_BIND_ADDRESS:?Set HOST_BIND_ADDRESS}:${POSTGRES_PUBLISHED_PORT:?Set POSTGRES_PUBLISHED_PORT}:${POSTGRES_PORT:?Set POSTGRES_PORT}"
    volumes: [daybook_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p ${POSTGRES_PORT:?Set POSTGRES_PORT} -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 15
  backend:
    build:
      context: ./backend
      target: development
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: ${POSTGRES_HOST:?Set POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT:?Set POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
      AUTH_RATE_WINDOW_SECONDS: ${AUTH_RATE_WINDOW_SECONDS:-300}
      BACKEND_BIND_ADDRESS: ${BACKEND_BIND_ADDRESS:?Set BACKEND_BIND_ADDRESS}
      BACKEND_PORT: ${BACKEND_PORT:?Set BACKEND_PORT}
    command:
      - sh
      - -c
      - 'alembic upgrade head && exec uvicorn app.main:app --reload --host "$$BACKEND_BIND_ADDRESS" --port "$$BACKEND_PORT"'
    ports:
      - "${HOST_BIND_ADDRESS:?Set HOST_BIND_ADDRESS}:${BACKEND_PUBLISHED_PORT:?Set BACKEND_PUBLISHED_PORT}:${BACKEND_PORT:?Set BACKEND_PORT}"
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build:
      context: ./frontend
      target: development
    volumes:
      - ./frontend/src:/app/src
    environment:
      VITE_API_PROXY: ${VITE_API_PROXY:?Set VITE_API_PROXY}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL}
      VITE_DEV_HOST: ${FRONTEND_BIND_ADDRESS:?Set FRONTEND_BIND_ADDRESS}
      VITE_DEV_PORT: ${FRONTEND_PORT:?Set FRONTEND_PORT}
      # Reliable file watching for Docker Desktop bind mounts.
      VITE_USE_POLLING: "true"
    ports:
      - "${HOST_BIND_ADDRESS:?Set HOST_BIND_ADDRESS}:${FRONTEND_PUBLISHED_PORT:?Set FRONTEND_PUBLISHED_PORT}:${FRONTEND_PORT:?Set FRONTEND_PORT}"
    depends_on: [backend]
volumes:
  daybook_data:

